services:
  app:
    build:
      context: ./backend
    container_name: app
    volumes:
      - ./backend:/var/www
    depends_on:
      - mysql
    networks:
      - appnet
    ports:
      - "9001:9001"
    expose:
      - "9001"
    environment:
      DB_HOST: mysql
      DB_DATABASE: github_issues
      DB_USERNAME: root
      DB_PASSWORD: root

  react:
    build: ./frontend
    container_name: react_app
    volumes:
      - ./frontend:/app
    networks:
      - appnet

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: github_issues
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/build:/usr/share/nginx/html
      - ./backend:/var/www
    depends_on:
      - app
      - react
    networks:
      - appnet

volumes:
  mysql_data:

networks:
  appnet:
    driver: bridge
