upstream php-upstream {
    server app:9001;
}

server {
    listen 80;
    server_name github-issues.local;

    # React static files (mounted via ./frontend/build)
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets (JS, CSS, etc.)
    location /static/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # React routes fallback to index.html
    location / {
        try_files $uri /index.html;
    }

    # Laravel API requests — routed to PHP-FPM via FastCGI
    location ~ ^/api/.*\.php$ {
        root /var/www/public;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
    }

    location /api/ {
        root /var/www/public;
        index index.php;
        try_files $uri /index.php?$query_string;
        fastcgi_pass php-upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    }

    # Optional: handle .php files (for legacy web.php routes)
    location ~ \.php$ {
        root /var/www/public;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
    }
}
