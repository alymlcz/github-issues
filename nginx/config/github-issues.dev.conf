upstream php-upstream {
    server app:9001;
}

server {
    listen 80;
    server_name github-issues.local;

    root /usr/share/nginx/html;
    index index.html index.php;

    # Serve static files from React build
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Laravel (PHP-FPM)
    location /api/ {
        proxy_pass http://app:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Let Laravel handle .php requests (e.g. /index.php, /web.php routes)
    location ~ \.php$ {
        root /var/www/public;
        fastcgi_pass app:9001;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # For assets like /storage, etc.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|svg|eot)$ {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }
}